repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        name: Linter (Ruff)
      - id: ruff-format
        name: Formatter (Ruff)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: Static type checker (mypy)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Trim trailing whitespace
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude_types: [ python ] # No use checking Python as Ruff has already done it
      # Ensure files end with an empty line
      - id: end-of-file-fixer
        name: Ensure files end in a single blank line
        exclude_types: [ python ] # No use checking Python as Ruff has already done it
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.4
    hooks:
      - id: uv-lock
        name: Ensure uv lockfile is up to date
